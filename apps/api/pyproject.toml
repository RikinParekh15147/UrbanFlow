[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "urbanflow-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3", "pymongo>=4.11,<5"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
