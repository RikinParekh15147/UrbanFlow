[project]
name = "urbanflow-dev"
version = "0.1.0"
description = "UrbanFlow development workspace"
requires-python = ">=3.12,<3.14"
dependencies = [
  "urbanflow-api",
  "urbanflow-etl",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "pyarrow>=19,<24"]

[tool.uv.workspace]
members = ["apps/api", "pipelines"]

[tool.uv.sources]
urbanflow-api = { workspace = true }
urbanflow-etl = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "pipelines/tests"]
addopts = "--basetemp=.cache/pytest"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
